name: Testes automaticos do Flask

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

jobs:
  testes:
    name: Testar aplicacao Flask
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxe
        run: python -m compileall -q app.py tests

      - name: Executar testes
        run: pytest -v --junitxml=relatorio-testes.xml

      - name: Salvar relatorio dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-dos-testes
          path: relatorio-testes.xml
          if-no-files-found: ignore
